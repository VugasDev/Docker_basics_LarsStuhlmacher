<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nginx im Docker-Container</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0f172a; color: #e2e8f0;
    }
    main { max-width: 34rem; padding: 2.5rem 2rem; }
    h1 { font-size: 1.6rem; margin: 0 0 .25rem; }
    .sub { color: #94a3b8; margin: 0 0 2rem; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: .6rem 0; border-top: 1px solid #1e293b; display: flex; justify-content: space-between; gap: 1rem; }
    a { color: #7dd3fc; }
    code { background: #1e293b; padding: .1rem .4rem; border-radius: 4px; font-size: .9em; }
  </style>
</head>
<body>
  <main>
    <h1>Es funktioniert.</h1>
    <p class="sub">Diese Seite wird von einem nginx-Container ausgeliefert,
       gestartet mit <code>docker compose -f nginx.yml up -d</code>.</p>
    <ul>
      <li><span>nginx (diese Seite)</span> <a href="http://localhost">localhost:80</a></li>
      <li><span>Pi-hole Admin</span> <a href="http://localhost:8081/admin">localhost:8081/admin</a></li>
      <li><span>Portainer</span> <a href="http://localhost:9000">localhost:9000</a></li>
      <li><span>Watchtower</span> <span style="color:#64748b">ohne Weboberfläche</span></li>
    </ul>
  </main>
</body>
</html>
