# Docker-Compose-Datei für Watchtower
#
# Grundlage: c't-3003-Gist
# (https://gist.github.com/jamct/2e6c03f60319423bc4bc6c23fc0aa359)
#
# ABWEICHUNG vom Gist — Image ausgetauscht:
# Das im Video verwendete Image "containrrr/watchtower" stammt vom 11.11.2023
# und spricht die Docker-API-Version 1.25. Aktuelle Docker-Engines verlangen
# mindestens API 1.44, der Container beendet sich deshalb sofort mit
# Exit-Code 1:
#   "client version 1.25 is too old. Minimum supported API version is 1.44"
# Das Projekt containrrr/watchtower wird seit 2023 nicht mehr gepflegt.
# Verwendet wird stattdessen der aktiv gepflegte Fork "nickfedor/watchtower",
# der dieselben Optionen versteht.
#
# Original-Zeile aus dem Video, hier nicht mehr lauffähig:
#   image: containrrr/watchtower
services:
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    command:
      # Ohne Einschränkung aktualisiert Watchtower JEDEN Container auf dem
      # Host — auch solche aus fremden Projekten. "--label-enable" begrenzt es
      # auf Container mit dem Label
      # com.centurylinklabs.watchtower.enable=true (gesetzt in pihole.yml,
      # portainer.yml und nginx.yml).
      - --label-enable
      # Prüfintervall in Sekunden. 3600 = stündlich; ohne Angabe wären es
      # 24 Stunden.
      - --interval
      - "3600"
      # Alte Images nach dem Update aufräumen, sonst sammeln sie sich an.
      - --cleanup
    environment:
      TZ: 'Europe/Berlin'
    volumes:
      # Watchtower steuert Docker über den Socket — wie Portainer.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
