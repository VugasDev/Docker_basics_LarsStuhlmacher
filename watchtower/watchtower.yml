# Docker-Compose-Datei für Watchtower (https://hub.docker.com/r/containrrr/watchtower)
#
# Quelle: c't-3003-Gist (https://gist.github.com/jamct/2e6c03f60319423bc4bc6c23fc0aa359)
# Das Image ist bewusst unverändert aus dem Gist übernommen.
#
# WICHTIG — bekannte Einschränkung:
# Das Image "containrrr/watchtower" stammt vom 11.11.2023 und spricht die
# Docker-API-Version 1.25. Aktuelle Docker-Engines (hier 29.1.3) verlangen
# mindestens API 1.44. Der Container startet deshalb und beendet sich sofort
# wieder mit Exit-Code 1 und der Meldung:
#   "client version 1.25 is too old. Minimum supported API version is 1.44"
# Das Projekt containrrr/watchtower wird nicht mehr gepflegt. Wer Watchtower
# produktiv nutzen möchte, weicht auf einen aktiven Fork aus, zum Beispiel
# "nickfedor/watchtower". Details stehen in der Readme.
services:
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    # ERGÄNZUNG (nicht aus dem Gist): Ohne Einschränkung aktualisiert Watchtower
    # JEDEN Container auf dem Host — auch solche aus fremden Projekten.
    # "--label-enable" begrenzt es auf Container, die ausdrücklich das Label
    # com.centurylinklabs.watchtower.enable=true tragen.
    command: --label-enable
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
